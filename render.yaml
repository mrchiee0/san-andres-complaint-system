services:
  # ─── Web Service (Express API + React SPA) ───────────────────────────────────
  # Render free tier: 512MB RAM, spins down after 15min inactivity.
  # MySQL is hosted externally on Filess.io (free, external connection, SSL required).
  - type: web
    name: san-andres-complaint-system
    runtime: node
    region: singapore        # Closest free Render region to the Philippines
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production

      # ── Database (Aiven MySQL) ──────────────────────────────────────────────
      # Set these in the Render dashboard — values from Aiven Overview tab.
      - key: DB_HOST
        sync: false          # e.g. mysql-xxxx.aivencloud.com
      - key: DB_PORT
        sync: false          # e.g.  3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"        # Filess.io requires SSL

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value

      # ── Email (Gmail SMTP) ──────────────────────────────────────────────────
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # ── Google OAuth ────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

      # ── Cloudinary ──────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Ably (real-time) ────────────────────────────────────────────────────
      - key: ABLY_API_KEY
        sync: false
      - key: VITE_ABLY_API_KEY
        sync: false

      # ── Gemini AI ───────────────────────────────────────────────────────────
      - key: VITE_GEMINI_API_KEY
        sync: false
